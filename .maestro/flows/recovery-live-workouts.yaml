# Recovery + live workout E2E coverage.
#
# Requires:
#   make seed-e2e
#   backend + Metro/dev client running

appId: com.thallo.app
name: recovery-live-workouts
tags:
  - e2e
  - seeded
  - workouts
  - recovery

---
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

- runFlow:
    file: dismiss-dev-client.yaml

- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: e2e_returning@test.thallo
      TEST_PASSWORD: SeedTest1234

- runFlow:
    when:
      visible: "Welcome to Thallo Pro"
    commands:
      - tapOn:
          id: "tutorial-skip"

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 60000

- runFlow:
    when:
      visible: "Catch up on yesterday"
    commands:
      - tapOn: "Skip for now"

- tapOn:
    id: "bottom-tab-workouts"
- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 30000

# Manual recovery activities should default to easy intensity and save through
# the same workout-history/backend completion path as other manual activities.
- scrollUntilVisible:
    element:
      id: "extra-workout-log"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- swipe:
    start: 50%,78%
    end: 50%,62%
    duration: 350
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: "extra-workout-log"
- extendedWaitUntil:
    visible:
      id: "activity-category-recovery"
    timeout: 15000
- tapOn:
    id: "activity-category-recovery"
- extendedWaitUntil:
    visible:
      id: "activity-subtype-recovery-sauna"
    timeout: 15000
- assertNotVisible: "Intensity"
- tapOn:
    id: "activity-subtype-recovery-sauna"
- assertVisible: "Log Sauna · 45 min · Today"
- tapOn:
    id: "activity-save"
- extendedWaitUntil:
    visible: "Sauna"
    timeout: 15000
- assertVisible: "Manual · 45m"

# Live cardio uses the timer first, then hands off to LogActivityModal with
# tracker-sourced duration/timestamps before saving.
- scrollUntilVisible:
    element:
      id: "extra-workout-custom"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- swipe:
    start: 50%,78%
    end: 50%,62%
    duration: 350
- waitForAnimationToEnd:
    timeout: 1000
- tapOn:
    id: "extra-workout-custom"
- extendedWaitUntil:
    visible: "Custom Workout"
    timeout: 15000
- assertVisible: "Pick a type. We'll time it and sync HR from Apple Health."
- scrollUntilVisible:
    element:
      id: "live-quickstart-cardio-walk"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn:
    id: "live-quickstart-cardio-walk"
- extendedWaitUntil:
    visible: "HEART RATE"
    timeout: 15000
- assertVisible: "WALK"
- tapOn:
    id: "live-finish"
- extendedWaitUntil:
    visible:
      id: "activity-prefill-summary"
    timeout: 20000
- assertVisible: "FROM YOUR TRACKER"
- assertVisible: "DURATION"
- assertVisible: "1 min"
- assertVisible: "Log Walk · 1 min · Today"
- tapOn:
    id: "activity-save"
- extendedWaitUntil:
    visible: "Walk"
    timeout: 15000
- assertVisible: "Custom · 1m"
