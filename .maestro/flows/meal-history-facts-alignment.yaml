# Verifies the same backend meal-history rows drive Meal History,
# Nutrition Trend, and Nutrition & Gut Facts macro/fact displays.
#
# Requires:
#   make seed-e2e
#   backend + Metro/dev client running

appId: com.thallo.app
name: meal-history-facts-alignment
tags:
  - e2e
  - seeded
  - meals
  - progress

---
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

- runFlow:
    file: dismiss-dev-client.yaml

- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: e2e_returning@test.thallo
      TEST_PASSWORD: SeedTest1234

- runFlow:
    when:
      visible: "Welcome to Thallo Pro"
    commands:
      - tapOn:
          id: "tutorial-skip"

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 60000

- tapOn:
    id: "bottom-tab-meals"
- extendedWaitUntil:
    visible: "Meal week"
    timeout: 30000
- tapOn:
    id: "meals-subtab-history"
- extendedWaitUntil:
    visible:
      id: "meal-history-screen"
    timeout: 30000

# The seeded history opens with a complete meal-history day. Use the
# row testID instead of exact macro text because Maestro can split the
# rendered totals string across accessibility nodes.
- extendedWaitUntil:
    visible:
      id: "meal-history-row-0"
    timeout: 15000
- runFlow:
    when:
      notVisible:
        id: "meal-history-row-0-meal-0"
    commands:
      - tapOn:
          id: "meal-history-row-0"
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow:
    when:
      notVisible:
        id: "meal-history-row-0-meal-0"
    commands:
      - tapOn:
          point: 50%,52%
      - waitForAnimationToEnd:
          timeout: 1000
- extendedWaitUntil:
    visible:
      id: "meal-history-row-0-meal-0"
    timeout: 15000
- assertVisible:
    id: "meal-history-row-0-meal-2"

# Progress facts should aggregate the same seven seeded meal-history days:
# four 933-cal days + three 1427-cal days => 1145 logged-cal average.
- tapOn:
    id: "bottom-tab-progress"
- extendedWaitUntil:
    visible:
      id: "progress-tab-screen"
    timeout: 30000
- tapOn:
    id: "progress-subtab-health"
- tapOn:
    point: 85%,19%
- waitForAnimationToEnd:
    timeout: 1000
- runFlow:
    when:
      notVisible:
        id: "nutrition-trend-card"
    commands:
      - swipe:
          start: 50%,78%
          end: 50%,28%
          duration: 450
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow:
    when:
      notVisible:
        id: "nutrition-trend-card"
    commands:
      - swipe:
          start: 50%,78%
          end: 50%,28%
          duration: 450
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow:
    when:
      notVisible:
        id: "nutrition-trend-card"
    commands:
      - swipe:
          start: 50%,78%
          end: 50%,28%
          duration: 450
      - waitForAnimationToEnd:
          timeout: 1000
- extendedWaitUntil:
    visible:
      id: "nutrition-trend-card"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "nutrition-trend-logged-calories-1145"
    timeout: 15000
- runFlow:
    when:
      notVisible:
        id: "nutrition-gut-facts-card"
    commands:
      - swipe:
          start: 50%,78%
          end: 50%,42%
          duration: 350
      - waitForAnimationToEnd:
          timeout: 1000
- extendedWaitUntil:
    visible:
      id: "nutrition-gut-facts-card"
    timeout: 15000
- tapOn:
    id: "nutrition-gut-facts-toggle"
- extendedWaitUntil:
    visible:
      id: "nutrition-gut-facts-days-7"
    timeout: 15000
- assertVisible:
    id: "nutrition-facts-macro-calories-1145"
