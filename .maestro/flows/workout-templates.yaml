# Saved workout template E2E coverage.
#
# Requires:
#   make seed-e2e
#   backend + Metro/dev client running

appId: com.thallo.app
name: workout-templates
tags:
  - e2e
  - seeded
  - workouts
  - templates

---
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

- runFlow:
    file: dismiss-dev-client.yaml

- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: e2e_returning@test.thallo
      TEST_PASSWORD: SeedTest1234

- runFlow:
    when:
      visible: "Welcome to Thallo Pro"
    commands:
      - tapOn:
          id: "tutorial-skip"

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 60000

- runFlow:
    when:
      visible: "Catch up on yesterday"
    commands:
      - tapOn: "Skip for now"

- tapOn:
    id: "bottom-tab-workouts"
- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 30000

# Build a saved template from the library.
- scrollUntilVisible:
    element:
      id: "workout-template-new"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- tapOn:
    id: "workout-template-new"
- extendedWaitUntil:
    visible: "New Template"
    timeout: 15000
- tapOn:
    id: "workout-template-name-input"
- inputText: "E2E Template"
- pressKey: Enter
- tapOn:
    id: "workout-template-add-exercise"
- extendedWaitUntil:
    visible: "Add Exercise"
    timeout: 15000
- tapOn:
    id: "workout-template-exercise-search"
- inputText: "Push-ups"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "workout-template-exercise-option-pushups"
    timeout: 30000
- tapOn:
    id: "workout-template-exercise-option-pushups"
- extendedWaitUntil:
    visible: "Push-ups"
    timeout: 15000
- tapOn:
    id: "workout-template-save"

# The newest template is inserted first; launching it should enter the normal
# ActiveWorkoutScreen with the template exercise intact. First reopen it in
# edit mode; this catches the saved-template edit affordance and persisted
# draft hydration.
- extendedWaitUntil:
    visible:
      id: "workout-template-edit-0"
    timeout: 15000
- tapOn:
    id: "workout-template-edit-0"
- extendedWaitUntil:
    visible: "Edit Template"
    timeout: 15000
- assertVisible: "Push-ups"
- tapOn:
    id: "workout-template-save"
- extendedWaitUntil:
    visible:
      id: "workout-template-start-0"
    timeout: 15000
- tapOn:
    id: "workout-template-start-0"
- extendedWaitUntil:
    visible:
      id: "active-workout-screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "exercise-card-0"
    timeout: 30000
- assertVisible:
    id: "active-exercise-name-0"
