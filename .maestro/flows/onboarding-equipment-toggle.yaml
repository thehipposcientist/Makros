# Cover the onboarding equipment-toggle path: tap the equipment
# button on a fresh sign-up so the planner knows what gear the user
# has. The signup-and-regen flow exercises a happy path; this one
# specifically verifies the equipment screen UI mounts without errors
# and a chip toggle persists into the next step.
#
# Requires: backend + Metro (no seed needed — fresh signup)

appId: com.thallo.app
name: onboarding-equipment-toggle
tags:
  - e2e
  - signup
  - onboarding
  - equipment

---
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

- runFlow:
    file: dismiss-dev-client.yaml

# Get to signup mode.
- extendedWaitUntil:
    visible:
      id: "auth-mode-signup"
    timeout: 30000
- tapOn:
    id: "auth-mode-signup"

- tapOn:
    id: "auth-first-name-input"
- inputText: "Equip"
- tapOn:
    id: "auth-last-name-input"
- inputText: "Tester"
- tapOn:
    id: "auth-email-input"
- inputText: "equip-test+${output.timestamp}@thallo.test"
- tapOn:
    id: "auth-username-input"
- inputText: "equiptest${output.timestamp}"
- tapOn:
    id: "auth-password-input"
- inputText: "SmokeStrong1!"
- tapOn:
    id: "auth-confirm-password-input"
- inputText: "SmokeStrong1!"
- tapOn:
    id: "auth-signup-recovery-answer-input"
- inputText: "Brutus"
- tapOn:
    id: "auth-legal-accept"
- tapOn:
    id: "auth-submit"

# Onboarding starts. Walk to the equipment step — text-driven since
# step ordering changes occasionally.
- extendedWaitUntil:
    visible: "What's your goal?"
    timeout: 30000

# Pick the first goal we see; flow's purpose is the equipment step,
# not goal selection.
- runFlow:
    when:
      visible: "Build muscle"
    commands:
      - tapOn: "Build muscle"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- extendedWaitUntil:
    visible: "What equipment do you have access to?"
    timeout: 60000

# Pick a single equipment chip — "Dumbbells" is a stable label across
# release iterations.
- tapOn: "Dumbbells"

# Continue and verify the next step renders. We don't care which —
# only that equipment-toggle persisted (no crash, no validation block).
- tapOn: "Continue"

# Loose end — the flow proves the toggle didn't error. Stop here so
# we don't get tangled with full plan generation.
