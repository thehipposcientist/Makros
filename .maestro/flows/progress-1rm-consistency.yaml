# Verifies that for a seeded user with workout history, the Progress
# Trends tab renders both the "Estimated 1 Rep Max" showcase tile and
# the selected exercise trend chart. After the rolling-e1RM overlay
# change, this catches the case where the showcase renders empty while
# the chart still has loaded workout data.
#
# Requires:
#   make seed-e2e
#   backend + Metro/dev client running

appId: com.thallo.app
name: progress-1rm-consistency
tags:
  - e2e
  - seeded
  - progress
  - workouts

---
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

- runFlow:
    file: dismiss-dev-client.yaml

- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: e2e_returning@test.thallo
      TEST_PASSWORD: SeedTest1234

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 60000

- runFlow:
    when:
      visible: "Catch up on yesterday"
    commands:
      - tapOn: "Skip for now"

# Switch to the Progress tab.
- tapOn:
    id: "bottom-tab-progress"
- extendedWaitUntil:
    visible:
      id: "progress-tab-screen"
    timeout: 30000
- tapOn:
    id: "progress-subtab-trends"

# Find the showcase tile. Seeded user has enough loaded strength
# history for at least one estimated 1RM, so the showcase must render.
- extendedWaitUntil:
    visible:
      id: "progress-1rm-showcase"
    timeout: 30000

- assertVisible: "Estimated 1 Rep Max"

# The selected exercise chart should render from the same loaded
# workout history, so Trends is not a one-card-only success.
- assertVisible:
    id: "progress-selected-exercise-chart"
