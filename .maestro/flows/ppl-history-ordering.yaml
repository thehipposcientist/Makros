# PPL history-aware ordering flow.
#
# Requires:
#   make seed-e2e
#   backend + Metro/dev client running

appId: com.thallo.app
name: ppl-history-ordering
tags:
  - smoke
  - seeded
  - workouts
  - plan

---
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

- runFlow:
    file: dismiss-dev-client.yaml

- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: e2e_ppl_open@test.thallo
      TEST_PASSWORD: SeedTest1234

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 60000

- tapOn:
    id: "bottom-tab-workouts"
- tapOn:
    id: "workout-subtab-plan"

- extendedWaitUntil:
    visible:
      id: "workout-week-day-chip-0"
    timeout: 30000

- extendedWaitUntil:
    visible: "Day 1, .*Legs"
    timeout: 30000
- extendedWaitUntil:
    visible: "Day 2, .*Pull \\+ Cardio"
    timeout: 30000
- extendedWaitUntil:
    visible: "Day 3, .*Push"
    timeout: 30000
