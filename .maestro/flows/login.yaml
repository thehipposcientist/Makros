# Login helper flow.
#
# Usage:
#   maestro test \
#     -e TEST_EMAIL=you@example.com \
#     -e TEST_PASSWORD=your-password \
#     .maestro/flows/login.yaml
#
# Can also be invoked from another flow via runFlow:
#   - runFlow:
#       file: login.yaml
#       env:
#         TEST_EMAIL: existing@thallo.test
#         TEST_PASSWORD: SmokeTest!2345
#
# If TEST_EMAIL / TEST_PASSWORD env vars are missing, the flow fails fast
# instead of silently logging in as the wrong user.

appId: com.thallo.app
name: login
tags:
  - helper

---
- launchApp:
    appId: com.thallo.app
    clearState: false      # preserve any existing session first
    clearKeychain: false

- runFlow:
    file: dismiss-dev-client.yaml

- waitForAnimationToEnd:
    timeout: 1000

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- waitForAnimationToEnd:
    timeout: 1000

- runFlow:
    when:
      visible: "Connected to:|Runtime version:.*"
    commands:
      - tapOn:
          point: "90%,48%"
          waitToSettleTimeoutMs: 0
      - waitForAnimationToEnd:
          timeout: 1000

- runFlow:
    when:
      visible: "Close"
      notVisible: "Connected to:|Runtime version:.*"
    commands:
      - tapOn:
          text: "Close"
          waitToSettleTimeoutMs: 0

- waitForAnimationToEnd:
    timeout: 1000

# If AuthScreen is visible, run the login steps. Otherwise assume we're
# already signed in and skip straight to asserting the home tab.
- runFlow:
    when:
      visible:
        id: "auth-email-input"
    commands:
      # AuthScreen default mode is login. Use stable testIDs so copy changes
      # like "Login" vs "Log In" do not break returning-user flows.
      - tapOn:
          id: "auth-email-input"
      - inputText: ${TEST_EMAIL}
      - pressKey: enter

      - runFlow:
          when:
            visible: "Speed up your typing"
          commands:
            - tapOn: "Continue"

      - tapOn:
          id: "auth-password-toggle"
      - tapOn:
          id: "auth-password-input"
      - inputText: ${TEST_PASSWORD}
      - pressKey: enter

      - runFlow:
          when:
            visible: "Speed up your typing"
          commands:
            - tapOn: "Continue"

      - runFlow:
          when:
            visible:
              id: "auth-submit"
          commands:
            - tapOn: "Personalized training, nutrition, and AI coaching."
            - tapOn:
                id: "auth-submit"

- waitForAnimationToEnd:
    timeout: 5000

- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"

- waitForAnimationToEnd:
    timeout: 2000

- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"

- runFlow:
    when:
      visible: "Legal And Safety"
    commands:
      - tapOn:
          id: "legal-done"

- runFlow:
    when:
      visible:
        id: "tutorial-skip"
    commands:
      - tapOn:
          id: "tutorial-skip"

- runFlow:
    when:
      visible:
        id: "tutorial-skip"
    commands:
      - tapOn:
          id: "tutorial-skip"

- waitForAnimationToEnd:
    timeout: 3000

- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"

- runFlow:
    when:
      visible:
        id: "tutorial-skip"
    commands:
      - tapOn:
          id: "tutorial-skip"

- runFlow:
    when:
      visible:
        id: "tutorial-skip"
    commands:
      - tapOn:
          id: "tutorial-skip"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- waitForAnimationToEnd:
    timeout: 1000

- runFlow:
    when:
      visible: "Connected to:|Runtime version:.*"
    commands:
      - tapOn:
          point: "90%,48%"
          waitToSettleTimeoutMs: 0
      - waitForAnimationToEnd:
          timeout: 1000

- runFlow:
    when:
      visible: "Close"
      notVisible: "Connected to:|Runtime version:.*"
    commands:
      - tapOn:
          text: "Close"
          waitToSettleTimeoutMs: 0

- runFlow:
    when:
      visible:
        id: "auth-email-input"
    commands:
      - tapOn:
          id: "auth-email-input"
      - inputText: ${TEST_EMAIL}
      - pressKey: enter

      - runFlow:
          when:
            visible: "Speed up your typing"
          commands:
            - tapOn: "Continue"

      - tapOn:
          id: "auth-password-toggle"
      - tapOn:
          id: "auth-password-input"
      - inputText: ${TEST_PASSWORD}
      - pressKey: enter

      - runFlow:
          when:
            visible: "Speed up your typing"
          commands:
            - tapOn: "Continue"

      - runFlow:
          when:
            visible:
              id: "auth-submit"
          commands:
            - tapOn: "Personalized training, nutrition, and AI coaching."
            - tapOn:
                id: "auth-submit"

- waitForAnimationToEnd:
    timeout: 3000

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 30000
