# Coach recovery recommendation apply/render flow.
#
# Requires:
#   make seed-e2e-recovery-apply
#   backend + Metro/dev client running

appId: com.thallo.app
name: recovery-recommendation-apply
tags:
  - smoke
  - seeded
  - workouts
  - coach

---
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

- runFlow:
    file: dismiss-dev-client.yaml

- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: e2e_recovery_apply@test.thallo
      TEST_PASSWORD: SeedTest1234

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 60000

- tapOn:
    id: "bottom-tab-workouts"
- tapOn:
    id: "workout-subtab-plan"

- extendedWaitUntil:
    visible:
      id: "workout-week-day-chip-1"
    timeout: 30000

# The seed helper applies the same swap_to_recovery action that the coach UI
# submits. Assert the durable day-state overlay in the week strip; card
# selection is covered by broader plan navigation flows and is too timing-heavy
# for this fast preflight slice.
- extendedWaitUntil:
    visible: "Day 2, .*Recovery Day"
    timeout: 30000
