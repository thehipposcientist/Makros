# Active workout swap recommendation and history hydration coverage.
#
# Requires:
#   make seed-e2e
#   backend + Metro/dev client running

appId: com.thallo.app
name: active-workout-swap-recommendations
tags:
  - e2e
  - seeded
  - workouts
  - active-workout
  - swap

---
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

- runFlow:
    file: dismiss-dev-client.yaml

- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: e2e_live_swap@test.thallo
      TEST_PASSWORD: SeedTest1234

- runFlow:
    when:
      visible: "Welcome to Thallo Pro"
    commands:
      - tapOn:
          id: "tutorial-skip"

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 60000

- runFlow:
    when:
      visible: "Catch up on yesterday"
    commands:
      - tapOn: "Skip for now"

- tapOn:
    id: "bottom-tab-workouts"
- extendedWaitUntil:
    visible:
      id: "start-workout-cta"
    timeout: 30000
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "start-workout-cta"
- waitForAnimationToEnd:
    timeout: 1000
- runFlow:
    when:
      notVisible:
        id: "active-workout-screen"
    commands:
      - tapOn: "Start Workout"
      - waitForAnimationToEnd:
          timeout: 1000

- extendedWaitUntil:
    visible:
      id: "active-workout-screen"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "exercise-card-0"
    timeout: 30000

- runFlow:
    when:
      visible: "Lock-screen timer unavailable"
    commands:
      - tapOn: "Not now"

- assertVisible:
    id: "active-exercise-name-0"
- extendedWaitUntil:
    visible:
      id: "pre-set-recommended-weight-value-0"
    timeout: 30000
- assertVisible:
    text: ".*120 lbs.*"

- tapOn:
    id: "swap-exercise-0"
- extendedWaitUntil:
    visible: "Swap Dumbbell Bench Press"
    timeout: 15000
- tapOn:
    id: "active-exercise-swap-search"
- inputText: "Dumbbell Shoulder Press"
- pressKey: Enter
- extendedWaitUntil:
    visible:
      id: "active-exercise-option-dumbbell-shoulder-press"
    timeout: 30000
- tapOn:
    id: "active-exercise-option-dumbbell-shoulder-press"

- extendedWaitUntil:
    visible:
      text: ".*Dumbbell Shoulder Press.*"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "pre-set-recommended-weight-value-0"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*85 lbs.*"
    timeout: 30000
- extendedWaitUntil:
    visible: ".*85.*9.*"
    timeout: 30000
- assertNotVisible:
    text: ".*120 lbs.*"
