# Workout reminder counterpart of meal-reminder-schedule-edit.yaml.
# Toggles reminders on and adjusts the time via the +/- buttons
# (testIDs: settings-workout-reminder-time-minus / -plus).
#
# Requires: make seed-e2e + backend + Metro

appId: com.thallo.app
name: workout-reminder-schedule-edit
tags:
  - e2e
  - seeded
  - settings
  - reminders

---
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"

- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: e2e_returning@test.thallo
      TEST_PASSWORD: SeedTest1234

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 60000

- runFlow:
    when:
      visible: "Catch up on yesterday"
    commands:
      - tapOn: "Skip for now"

- tapOn:
    id: "bottom-tab-you"
- tapOn:
    id: "profile-settings-open"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000

- scrollUntilVisible:
    element:
      id: "settings-workout-reminders-toggle"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn:
    id: "settings-workout-reminders-toggle"

# Bump the reminder time by 30 mins (two +15 taps) to verify the
# +/- adjuster wires through state.
- scrollUntilVisible:
    element:
      id: "settings-workout-reminder-time-plus"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn:
    id: "settings-workout-reminder-time-plus"
- tapOn:
    id: "settings-workout-reminder-time-plus"

# Toggle skip-completed on. Persists separately from the schedule.
- scrollUntilVisible:
    element:
      id: "settings-workout-skip-completed-toggle"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn:
    id: "settings-workout-skip-completed-toggle"

# Round-trip persistence check — leave settings, come back, the
# toggle is still on (we know the toggle has state because tapping
# it again would flip it; here we only verify the screen renders
# without reverting wholesale).
- tapOn:
    id: "settings-back"
- tapOn:
    id: "profile-settings-open"
- extendedWaitUntil:
    visible:
      id: "settings-screen"
    timeout: 15000
