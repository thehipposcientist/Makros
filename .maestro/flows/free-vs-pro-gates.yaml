# Free vs Pro feature-gate E2E coverage.
#
# Requires:
#   make seed-e2e
#   backend + Metro/dev client running
#   EXPO_PUBLIC_DISABLE_FREE_BETA_FULL_ACCESS=1 npx expo start --dev-client
#
# The extra env flag is intentional: app.json enables full beta access by
# default, which makes even seeded free users behave as Pro unless disabled.

appId: com.thallo.app
name: free-vs-pro-gates
tags:
  - e2e
  - seeded
  - subscription

---
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"

- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: e2e_free@test.thallo
      TEST_PASSWORD: SeedTest1234

- runFlow:
    when:
      visible: "Start with manual tracking"
    commands:
      - tapOn:
          id: "tutorial-skip"

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 60000

- runFlow:
    when:
      visible: "Catch up on yesterday"
    commands:
      - tapOn: "Skip for now"

# Free users keep manual workout tools, but no generated recovery/import
# surfaces or HealthKit live-tracker copy.
- tapOn:
    id: "bottom-tab-workouts"
- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 30000
- scrollUntilVisible:
    element:
      id: "extra-workout-custom"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- assertVisible:
    id: "extra-workout-log"
- assertNotVisible:
    id: "detected-workouts-card"
- tapOn:
    id: "extra-workout-custom"
- extendedWaitUntil:
    visible: "Custom Workout"
    timeout: 15000
- assertVisible: "Pick a type. We'll time it and save the activity to your log."
- tapOn:
    id: "live-tracker-close"

# Free meal tools are manual-first and the Pro grocery card is hidden.
- tapOn:
    id: "bottom-tab-meals"
- extendedWaitUntil:
    visible: "Meal week"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Manual meal logging"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn: "Foods tab"
- assertNotVisible:
    id: "foods-grocery-list-card"

# Free can open the coach surface, but sending asks for Pro.
- tapOn:
    id: "open-ai-coach"
- extendedWaitUntil:
    visible: "AI Coach"
    timeout: 15000
- tapOn:
    id: "ai-coach-input"
- inputText: "Can you adjust my plan?"
- tapOn:
    id: "ai-coach-send"
- extendedWaitUntil:
    visible: "Upgrade to Pro"
    timeout: 15000
- tapOn: "Not now"

# Relaunch as a seeded Pro user under the same no-beta override. Pro should
# get generated planning and the richer HR/grocery surfaces.
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"

- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: e2e_returning@test.thallo
      TEST_PASSWORD: SeedTest1234

- runFlow:
    when:
      visible: "Welcome to Thallo Pro"
    commands:
      - tapOn:
          id: "tutorial-skip"

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 60000

- runFlow:
    when:
      visible: "Catch up on yesterday"
    commands:
      - tapOn: "Skip for now"

- tapOn:
    id: "bottom-tab-workouts"
- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 30000
- assertVisible:
    text: "(?i)(Upper|Lower|Push|Pull|Legs|Full Body)"
- scrollUntilVisible:
    element:
      id: "extra-workout-custom"
    direction: DOWN
    timeout: 20000
    visibilityPercentage: 50
- tapOn:
    id: "extra-workout-custom"
- extendedWaitUntil:
    visible: "Custom Workout"
    timeout: 15000
- assertVisible: "Pick a type. We'll time it and sync HR from Apple Health."
- tapOn:
    id: "live-tracker-close"

- tapOn:
    id: "bottom-tab-meals"
- extendedWaitUntil:
    visible: "Meal week"
    timeout: 30000
- tapOn: "Foods tab"
- scrollUntilVisible:
    element:
      id: "foods-grocery-list-card"
    direction: UP
    timeout: 15000
    visibilityPercentage: 50
