# Thallo seeded returning-user smoke flow.
#
# Requires:
#   make seed-e2e
#   backend + Metro/dev client running

appId: com.thallo.app
name: seeded-returning-user
tags:
  - smoke
  - seeded
  - returning-user

---
- launchApp:
    appId: com.thallo.app
    clearState: true
    clearKeychain: true

# Dev-client builds open the Expo launcher first. Release/TestFlight builds skip
# this screen and land directly in Thallo.
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"

- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"

- runFlow:
    when:
      visible: "Close"
    commands:
      - tapOn: "Close"

- runFlow:
    file: login.yaml
    env:
      TEST_EMAIL: e2e_returning@test.thallo
      TEST_PASSWORD: SeedTest1234

- runFlow:
    when:
      visible: "Welcome to Thallo Pro"
    commands:
      - tapOn:
          id: "tutorial-skip"

- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 60000

# Returning user should land with persisted PlanWeek data and a visible workout.
- assertVisible:
    text: ".*Upper.*"

# Walk the full persisted 7-day PlanWeek. This catches stale cache fallbacks,
# missing PlanDay rows, and date-strip regressions before we hand testers a
# build. Use indexed week-chip IDs because seed-e2e anchors PlanWeek at the
# day the seed command runs; absolute day labels go stale daily.
- extendedWaitUntil:
    visible:
      id: "workout-week-day-chip-0"
    timeout: 30000
- tapOn:
    id: "workout-week-day-chip-0"
- assertVisible:
    text: ".*Upper.*"
- assertVisible:
    id: "workout-estimated-duration"
# Returning persona is a 45-60 minute plan (stored as session_minutes=60).
# This guards the old regression where the plan card displayed ~75 min.
- assertNotVisible:
    text: ".*~(6[1-9]|[7-9][0-9]|1[0-9]{2}) min.*"
- tapOn:
    id: "workout-week-day-chip-1"
- assertVisible:
    text: ".*Lower.*"
- tapOn:
    id: "workout-week-day-chip-2"
- assertVisible: "Rest Day"
- tapOn:
    id: "workout-week-day-chip-3"
- assertVisible:
    text: ".*Upper.*"
- tapOn:
    id: "workout-week-day-chip-4"
- assertVisible:
    text: ".*Lower.*"
- tapOn:
    id: "workout-week-day-chip-5"
- assertVisible: "Rest Day"
- tapOn:
    id: "workout-week-day-chip-6"
- assertVisible: "Rest Day"
- tapOn:
    id: "workout-week-day-chip-0"

# Weekly digest is time-gated by the app (Sunday or after 6pm local). When it
# is eligible, assert the seeded summary card has real session/adherence/set data.
- runFlow:
    when:
      visible: ".*Week in review.*"
    commands:
      - assertVisible: "sessions"
      - assertVisible: "adherence"
      - assertVisible: "sets"

# Meals: seeded DayState nutrition plan plus checked-plan history should render.
- tapOn:
    id: "bottom-tab-meals"
- extendedWaitUntil:
    visible: "Meal week"
    timeout: 30000
- assertVisible:
    id: "today-meal-card"
- tapOn:
    id: "today-meal-card-header"
- extendedWaitUntil:
    visible:
      id: "today-nutrition-card"
    timeout: 30000

# Pro food surface should be available for seeded beta/pro users.
- tapOn: "Foods tab"
- scrollUntilVisible:
    element:
      id: "foods-grocery-list-card"
    direction: UP
    timeout: 15000
    visibilityPercentage: 50

# Progress should hydrate seeded backend history, meal history, PRs, and weight data.
- tapOn:
    id: "bottom-tab-progress"
- extendedWaitUntil:
    visible:
      id: "progress-tab-screen"
    timeout: 30000
- extendedWaitUntil:
    visible: "PLAN WEEK"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "progress-overview-week-meals"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "progress-overview-week-weight"
    timeout: 30000
- tapOn: "Body"
- extendedWaitUntil:
    visible:
      id: "progress-weight-card"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "progress-weight-current-value"
    timeout: 30000

- tapOn:
    id: "bottom-tab-you"
- extendedWaitUntil:
    visible:
      id: "you-tab-screen"
    timeout: 30000

# Social should load the seeded friend graph and privacy copy.
- tapOn:
    id: "bottom-tab-social"
- extendedWaitUntil:
    visible: "Activity"
    timeout: 30000
- assertVisible:
    text: ".*Friends only see workouts.*"

# Start Workout still needs to hydrate from the seeded PlanWeek.
- tapOn:
    id: "bottom-tab-workouts"
- extendedWaitUntil:
    visible: "Plan tab"
    timeout: 30000
- scrollUntilVisible:
    element:
      text: "Extra workouts"
    direction: DOWN
    timeout: 15000
    visibilityPercentage: 50
- tapOn:
    id: "start-workout-cta"
- extendedWaitUntil:
    visible:
      id: "active-workout-screen"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "exercise-card-0"
    timeout: 30000
